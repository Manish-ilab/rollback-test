name: Deploy and Build

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional image version tag'
        required: false

env:
  AWS_REGION: ap-south-1
  ECR_REPO_BACKEND: rollback-test
  ECR_REGISTRY: 687444329037.dkr.ecr.ap-south-1.amazonaws.com

jobs:
  remote-build:
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.taggen.outputs.image_tag }}
    steps:
      - name: Set image tag
        id: taggen
        run: |
          IMAGE_TAG="${{ github.event.inputs.version }}"
          if [ -z "$IMAGE_TAG" ]; then
            IMAGE_TAG=$(echo $GITHUB_SHA | cut -c1-7)
          fi
          echo "image_tag=$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Build and push on Server 1
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST_TEST }}
          username: ${{ secrets.SERVER_USER_TEST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ECR_REPO_BACKEND,ECR_REPO_FRONTEND,ECR_REGISTRY,AWS_REGION
          timeout: 1000s
          script: |
            set -e
            IMAGE_TAG="${{ steps.taggen.outputs.image_tag }}"
            cd /home/ntkyc/workspace/dsm-mono-test/rollback-test

            echo "Checking out latest version..."
            git checkout master
            git pull origin --rebase

            echo "Logging into ECR..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            echo "Building backend image..."
            docker build -t $ECR_REGISTRY/$ECR_REPO_BACKEND:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPO_BACKEND:latest .

            echo "Pushing backend image to ECR..."
            docker push $ECR_REGISTRY/$ECR_REPO_BACKEND:$IMAGE_TAG
            docker push $ECR_REGISTRY/$ECR_REPO_BACKEND:latest

  deploy:
    needs: remote-build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy on Server 2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_HOST_TEST }}
          username: ${{ secrets.SERVER_USER_TEST }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: ECR_REPO_BACKEND,ECR_REGISTRY,AWS_REGION
          script: |
            set -e
            IMAGE_TAG=${{ needs.remote-build.outputs.image_tag }}

            echo "Login to ECR..."
            aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY

            cd /home/ntkyc/workspace/dsm-mono-test/rollback-test
            git checkout master
            git pull origin master

            echo "Pulling image..."
            docker pull $ECR_REGISTRY/$ECR_REPO_BACKEND:$IMAGE_TAG
  
            # echo "Updating compose file..."
            # sed -i "s|$ECR_REPO_BACKEND:.*|$ECR_REPO_BACKEND:$IMAGE_TAG|g" docker-compose-dev.yml


            echo "Starting services..."
            docker compose -f docker-compose-dev.yml up -d --force-recreate

  notify:
    needs: [remote-build, deploy]
    runs-on: ubuntu-latest
    if: always()

    steps:

      - name: Prepare notification message
        id: msg
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            echo "message=🚀 *Deployment Successful!*" >> $GITHUB_OUTPUT
            echo "color=#2ECC71" >> $GITHUB_OUTPUT
          else
            echo "message=❌ *Deployment Failed!*" >> $GITHUB_OUTPUT
            echo "color=#E74C3C" >> $GITHUB_OUTPUT
          fi

      - name: Send notification to Mattermost
        run: |
          curl -X POST -H 'Content-Type: application/json' \
          -d "{
                \"username\": \"AlertBot\",
                \"icon_url\": \"https://github.githubassets.com/images/modules/logos_page/GitHub-Mark.png\",
                \"attachments\": [{
                    \"fallback\": \"Deployment Notification\",
                    \"color\": \"${{ steps.msg.outputs.color }}\",
                    \"text\": \"${{ steps.msg.outputs.message }}\nRepo: **${{ github.repository }}**\nBranch: **${{ github.ref_name }}**\nTriggered by: **${{ github.actor }}**\",
                    \"fields\": [
                      {\"short\": true, \"title\": \"Status\", \"value\": \"${{ needs.deploy.result }}\"}
                    ]
                }]
          }" \
          ${{ secrets.MATTERMOST_WEBHOOK_URL }}
